name: TripTracker
options:
  bundleIdPrefix: com.jamesschliesske
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  TripTracker:
    type: application
    platform: iOS
    sources:
      - path: TripTracker
    info:
      path: TripTracker/Info.plist
      properties:
        TripTrackerPushRegistrationSecret: "$(TRIPTRACKER_PUSH_REGISTRATION_SECRET)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        TRIPTRACKER_PUSH_REGISTRATION_SECRET: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesschliesske.triptracker
        INFOPLIST_KEY_CFBundleDisplayName: TripTracker
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TripTracker/TripTracker.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TripTracker/TripTrackerRelease.entitlements
