services:
  triptracker:
    build: .
    image: triptracker:0.7.0
    container_name: triptracker
    restart: unless-stopped
    ports:
      - "8772:8772"
    environment:
      PORT: "8772"
      NODE_OPTIONS: "--max-old-space-size=128"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - ./data:/app/data
    mem_limit: 192m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 20s

  recovery:
    image: docker:28-cli
    container_name: triptracker-recovery
    restart: unless-stopped
    depends_on:
      triptracker:
        condition: service_started
    environment:
      TARGET_CONTAINER: triptracker
      CHECK_INTERVAL_SECONDS: "15"
      RESTART_COOLDOWN_SECONDS: "90"
      MAX_RESTARTS_PER_WINDOW: "3"
      RESTART_WINDOW_SECONDS: "900"
    entrypoint: ["/bin/sh", "/opt/triptracker/watch-health.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/watch-health.sh:/opt/triptracker/watch-health.sh:ro
      - recovery-state:/state
    network_mode: none
    read_only: true
    mem_limit: 64m
    pids_limit: 32

volumes:
  recovery-state:
